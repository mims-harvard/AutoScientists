name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Checks (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test tooling
        run: python -m pip install ruff

      - name: Compile launcher
        run: python -m py_compile launch.py

      - name: Lint critical Python errors
        run: ruff check launch.py --select E9,F63,F7,F82

      - name: Check required task files
        shell: bash
        run: |
          test -f task-autoresearch/TASK.md
          test -f task-autoresearch/LAUNCH.md
          test -f task-protein-gym/TASK.md
          test -f task-protein-gym/LAUNCH.md
          test -f task-biomlbench/LAUNCH.md
